<div class="w746mh" id="mhw">
<style>
.w746mh{--ink:#222;--ink2:#555;--card:#f4f4f2;font-family:inherit;margin:1em 0 1.5em;max-width:760px}
.w746mh .row{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-bottom:8px}
.w746mh .row label{color:var(--ink2);font-size:15px;margin:0;font-weight:400;min-width:150px}
.w746mh .row input[type=range]{flex:1;min-width:160px}
.w746mh .row output{font-weight:600;min-width:40px;text-align:right}
.w746mh button{font-size:14px;padding:4px 12px;border:1px solid #bbb;border-radius:6px;background:#fff;cursor:pointer}
.w746mh button:hover{background:#eee}
.w746mh .cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:8px 0}
.w746mh .card{background:var(--card);border-radius:8px;padding:8px 12px}
.w746mh .card .k{font-size:13px;color:var(--ink2)}
.w746mh .card .v{font-size:17px;font-weight:600;color:var(--ink)}
.w746mh canvas{width:100%;height:auto;display:block}
.w746mh .note{font-size:14px;color:var(--ink2);margin:4px 0}
@media (max-width:600px){.w746mh .cards{grid-template-columns:repeat(2,minmax(0,1fr))}}
</style>
<div class="row"><label for="mhw-n">Number of doors</label><input type="range" id="mhw-n" min="3" max="10" step="1" value="3"><output id="mhw-n-o"></output></div>
<div class="row">
  <button id="mhw-one">Play 1 game</button>
  <button id="mhw-hundred">Play 100 games</button>
  <button id="mhw-thousand">Play 1,000 games</button>
  <button id="mhw-reset">Reset</button>
</div>
<div class="cards">
  <div class="card"><div class="k">Games played</div><div class="v" id="mhw-g"></div></div>
  <div class="card"><div class="k">Staying won</div><div class="v" id="mhw-s"></div></div>
  <div class="card"><div class="k">Switching won</div><div class="v" id="mhw-w"></div></div>
  <div class="card"><div class="k">Theory: stay, switch</div><div class="v" id="mhw-t"></div></div>
</div>
<canvas id="mhw-cv" width="760" height="150" role="img" aria-label="The doors in the last game: your pick, the doors the host opened, and the prize."></canvas>
<p class="note">The host knows where the prize is. After your pick, he opens every other door except one, never opening the prize door. Each game is scored twice: once as if you stayed, once as if you switched to the one door he left closed.</p>
<script>
(function(){
const $=id=>document.getElementById('mhw-'+id);
let g=0,stay=0,sw=0,last=null;
function rint(n){return Math.floor(Math.random()*n);}
function play(n){
  const prize=rint(n),pick=rint(n);
  let keep;
  if(pick!==prize)keep=prize;else{const others=[];for(let d=0;d<n;d++)if(d!==pick)others.push(d);keep=others[rint(others.length)];}
  g++;if(pick===prize)stay++;if(keep===prize)sw++;
  last={n,prize,pick,keep};
}
function draw(){
  const n=+$('n').value;$('n-o').textContent=n;
  $('g').textContent=g.toLocaleString();
  $('s').textContent=g?(stay/g).toFixed(3):'';$('w').textContent=g?(sw/g).toFixed(3):'';
  $('t').textContent=(1/n).toFixed(3)+', '+((n-1)/n).toFixed(3);
  const c=$('cv'),x=c.getContext('2d'),W=c.width,H=c.height;
  x.clearRect(0,0,W,H);x.fillStyle='#fff';x.fillRect(0,0,W,H);
  x.font='13px sans-serif';x.textAlign='center';
  if(!last||last.n!==n){x.fillStyle='#888';x.fillText('Play a game to see the doors here.',W/2,H/2);return;}
  const dw=Math.min(62,(W-40)/n-10),gap=(W-n*dw)/(n+1);
  for(let d=0;d<n;d++){
    const x0=gap+d*(dw+gap),y0=30,h=80,open=(d!==last.pick&&d!==last.keep);
    x.fillStyle=open?'#f0f0f0':'#c9a26b';x.fillRect(x0,y0,dw,h);
    x.strokeStyle=d===last.pick?'#2c5d8a':'#777';x.lineWidth=d===last.pick?4:1;x.strokeRect(x0,y0,dw,h);x.lineWidth=1;
    x.fillStyle='#333';x.fillText(String(d+1),x0+dw/2,y0-8);
    if(d===last.prize){x.fillStyle='#c0392b';x.beginPath();x.arc(x0+dw/2,y0+h/2,10,0,2*Math.PI);x.fill();}
    else if(open){x.fillStyle='#777';x.fillText('goat',x0+dw/2,y0+h/2+4);}
    x.fillStyle='#555';x.fillText(d===last.pick?'your pick':(open?'opened':'left closed'),x0+dw/2,y0+h+18);
  }
}
function run(k){const n=+$('n').value;for(let i=0;i<k;i++)play(n);draw();}
$('one').addEventListener('click',()=>run(1));
$('hundred').addEventListener('click',()=>run(100));
$('thousand').addEventListener('click',()=>run(1000));
$('reset').addEventListener('click',()=>{g=0;stay=0;sw=0;last=null;draw();});
$('n').addEventListener('input',()=>{g=0;stay=0;sw=0;last=null;draw();});
draw();
})();
</script>
</div>
