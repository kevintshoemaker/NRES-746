<div class="w746sc" id="scw">
<style>
.w746sc{--ink:#222;--ink2:#555;--card:#f4f4f2;font-family:inherit;margin:1em 0 1.5em;max-width:760px}
.w746sc .row{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-bottom:8px}
.w746sc .row label{color:var(--ink2);font-size:15px;margin:0;font-weight:400;min-width:190px}
.w746sc .row input[type=range]{flex:1;min-width:160px}
.w746sc .row output{font-weight:600;min-width:60px;text-align:right}
.w746sc .cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:8px 0}
.w746sc .card{background:var(--card);border-radius:8px;padding:8px 12px}
.w746sc .card .k{font-size:13px;color:var(--ink2)}
.w746sc .card .v{font-size:17px;font-weight:600;color:var(--ink)}
.w746sc canvas{width:100%;height:auto;display:block}
.w746sc .note{font-size:14px;color:var(--ink2);margin:4px 0}
@media (max-width:600px){.w746sc .cards{grid-template-columns:repeat(2,minmax(0,1fr))}}
</style>
<div class="row"><label for="scw-prev">Prevalence, P(present)</label><input type="range" id="scw-prev" min="-3" max="-0.301" step="0.01" value="-1.699"><output id="scw-prev-o"></output></div>
<div class="row"><label for="scw-sens">Sensitivity, P(+ | present)</label><input type="range" id="scw-sens" min="0.5" max="1" step="0.01" value="0.9"><output id="scw-sens-o"></output></div>
<div class="row"><label for="scw-fpr">False positive rate, P(+ | absent)</label><input type="range" id="scw-fpr" min="0" max="0.2" step="0.005" value="0.05"><output id="scw-fpr-o"></output></div>
<div class="cards">
  <div class="card"><div class="k">P(+)</div><div class="v" id="scw-pp"></div></div>
  <div class="card"><div class="k">P(present | +)</div><div class="v" id="scw-ppv"></div></div>
  <div class="card"><div class="k">Positives per 10,000</div><div class="v" id="scw-npos"></div></div>
  <div class="card"><div class="k">of which truly present</div><div class="v" id="scw-ntp"></div></div>
</div>
<canvas id="scw-cv" width="760" height="470" role="img" aria-label="Ten thousand squares, one per sample, colored by true status and test result."></canvas>
<p class="note">Each square is one of 10,000 samples, colored by expected counts (rounded). Dark red: present, tested positive. Pale red: present, missed. Orange: absent, tested positive anyway. Grey: absent, negative.</p>
<script>
(function(){
const $=id=>document.getElementById('scw-'+id);
function f(p){if(p<0.0005)return p.toExponential(1);return p.toFixed(3);}
function draw(){
  const prev=Math.pow(10,+$('prev').value),sens=+$('sens').value,fpr=+$('fpr').value;
  $('prev-o').textContent=prev<0.01?prev.toFixed(4):prev.toFixed(3);$('sens-o').textContent=sens.toFixed(2);$('fpr-o').textContent=fpr.toFixed(3);
  const pp=prev*sens+(1-prev)*fpr,ppv=prev*sens/pp;
  $('pp').textContent=f(pp);$('ppv').textContent=f(ppv);
  const N=10000,pres=Math.round(N*prev),tp=Math.round(N*prev*sens),fn=pres-tp,fp=Math.round(N*(1-prev)*fpr);
  $('npos').textContent=(tp+fp).toLocaleString();$('ntp').textContent=tp.toLocaleString();
  const c=$('cv'),x=c.getContext('2d'),W=c.width,H=c.height;
  x.clearRect(0,0,W,H);x.fillStyle='#fff';x.fillRect(0,0,W,H);
  const cols=125,rows=80,cw=W/cols,ch=(H-10)/rows;
  const seq=[[tp,'#a01d1d'],[fn,'#f2b8b8'],[fp,'#e8902a'],[N-tp-fn-fp,'#e4e4e4']];
  let k=0;
  seq.forEach(([n,col])=>{x.fillStyle=col;for(let i=0;i<n;i++,k++){const r=Math.floor(k/cols),q=k%cols;x.fillRect(q*cw+0.4,5+r*ch+0.4,cw-0.8,ch-0.8);}});
}
['prev','sens','fpr'].forEach(id=>$(id).addEventListener('input',draw));
draw();
})();
</script>
</div>
