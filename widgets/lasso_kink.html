<div class="w746" id="lk">
<style>
.w746{--ink:#222;--ink2:#555;--muted:#8a8a8a;--card:#f4f4f2;--lasso:#2a78d6;--ridge:#eb6834;font-family:inherit;margin:1em 0 1.5em;max-width:720px}
.w746 .row{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.w746 .row label{color:var(--ink2);font-size:15px;margin:0;font-weight:400}
.w746 input[type=range]{flex:1}
.w746 .val{font-weight:600;min-width:42px}
.w746 .cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-bottom:8px}
.w746 .card{background:var(--card);border-radius:8px;padding:8px 12px}
.w746 .card .k{font-size:13px;color:var(--ink2)}
.w746 .card .v{font-size:20px;font-weight:600;color:var(--ink)}
.w746 svg text{font-family:inherit}
.w746 .ax{stroke:var(--muted);stroke-width:1}
.w746 .lab{fill:var(--ink2);font-size:13px}
.w746 .tk{fill:var(--muted);font-size:11px}
.w746 .key{display:flex;flex-wrap:wrap;gap:16px;font-size:13px;color:var(--ink2)}
.w746 .key span{display:flex;align-items:center;gap:6px}
</style>
<div class="row">
  <label for="lk-lam">Penalty &lambda;</label>
  <input type="range" id="lk-lam" min="0" max="2" step="0.05" value="0.4">
  <span class="val" id="lk-lamout">0.40</span>
</div>
<div class="cards">
  <div class="card"><div class="k">Lasso estimate</div><div class="v" id="lk-lo"></div></div>
  <div class="card"><div class="k">Ridge estimate</div><div class="v" id="lk-ro"></div></div>
  <div class="card"><div class="k">NLL pull vs. lasso push at 0</div><div class="v" id="lk-pp" style="font-size:16px;margin-top:3px"></div></div>
</div>
<svg viewBox="0 0 680 295" width="100%" role="img" aria-label="Left: lasso objective with its minimum. Right: lasso and ridge estimates as lambda grows.">
  <text class="lab" x="180" y="15" text-anchor="middle">Lasso objective: (&beta; &minus; 0.4)&sup2; + &lambda;|&beta;|</text>
  <text class="lab" x="522" y="15" text-anchor="middle">Estimate as &lambda; grows</text>
  <g id="lk-left"></g><g id="lk-right"></g>
</svg>
<div class="key">
  <span><svg width="24" height="6"><line x1="0" y1="3" x2="24" y2="3" stroke="#2a78d6" stroke-width="2.5"/></svg>lasso: max(0, 0.4 &minus; &lambda;/2)</span>
  <span><svg width="24" height="6"><line x1="0" y1="3" x2="24" y2="3" stroke="#eb6834" stroke-width="2.5" stroke-dasharray="5 3"/></svg>ridge: 0.4 / (1 + &lambda;)</span>
  <span><svg width="24" height="6"><line x1="0" y1="3" x2="24" y2="3" stroke="#8a8a8a" stroke-width="1.5" stroke-dasharray="2 3"/></svg>NLL alone (&lambda; = 0)</span>
</div>
<script>
(function(){
const NS='http://www.w3.org/2000/svg';
function el(t,a,p){const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);p.appendChild(e);return e;}
function txt(cls,x,y,s,p,anchor){const t=el('text',{class:cls,x:x,y:y,'text-anchor':anchor||'middle'},p);t.textContent=s;return t;}
const L={x0:50,x1:320,y0:255,y1:32,bmin:-0.15,bmax:0.6,fmax:0.8};
const R={x0:392,x1:665,y0:255,y1:32,lmax:2,emax:0.42};
const lx=b=>L.x0+(b-L.bmin)/(L.bmax-L.bmin)*(L.x1-L.x0);
const ly=f=>L.y0-Math.min(f,L.fmax)/L.fmax*(L.y0-L.y1);
const rx=l=>R.x0+l/R.lmax*(R.x1-R.x0);
const ry=e=>R.y0-e/R.emax*(R.y0-R.y1);
const left=document.getElementById('lk-left'),right=document.getElementById('lk-right');
el('line',{class:'ax',x1:L.x0,y1:L.y0,x2:L.x1,y2:L.y0},left);
el('line',{class:'ax',x1:L.x0,y1:L.y0,x2:L.x0,y2:L.y1},left);
el('line',{x1:lx(0),y1:L.y0,x2:lx(0),y2:L.y1,stroke:'#ddd','stroke-width':1},left);
[-0.1,0,0.2,0.4,0.6].forEach(b=>txt('tk',lx(b),L.y0+15,b.toFixed(1),left));
[0,0.4,0.8].forEach(f=>txt('tk',L.x0-6,ly(f)+4,f.toFixed(1),left,'end'));
txt('lab',(L.x0+L.x1)/2,288,'coefficient β',left);
el('line',{class:'ax',x1:R.x0,y1:R.y0,x2:R.x1,y2:R.y0},right);
el('line',{class:'ax',x1:R.x0,y1:R.y0,x2:R.x0,y2:R.y1},right);
[0,0.5,0.8,1,1.5,2].forEach(l=>txt('tk',rx(l),R.y0+15,l===0.8?'0.8':l.toFixed(1),right));
[0,0.2,0.4].forEach(e=>txt('tk',R.x0-6,ry(e)+4,e.toFixed(1),right,'end'));
txt('lab',(R.x0+R.x1)/2,288,'penalty λ',right);
el('line',{x1:rx(0.8),y1:R.y0,x2:rx(0.8),y2:R.y1,stroke:'#8a8a8a','stroke-width':1,'stroke-dasharray':'2 3'},right);
txt('tk',rx(0.8)+5,R.y1+10,'lasso reaches 0',right,'start');
let pl='',pr='';
for(let i=0;i<=200;i++){const l=i/100;pl+=(i?'L':'M')+rx(l)+','+ry(Math.max(0,0.4-l/2));pr+=(i?'L':'M')+rx(l)+','+ry(0.4/(1+l));}
el('path',{d:pl,fill:'none',stroke:'#2a78d6','stroke-width':2.5},right);
el('path',{d:pr,fill:'none',stroke:'#eb6834','stroke-width':2.5,'stroke-dasharray':'6 4'},right);
let p0='';for(let i=0;i<=150;i++){const b=L.bmin+i/150*(L.bmax-L.bmin);p0+=(i?'L':'M')+lx(b)+','+ly((b-0.4)**2);}
el('path',{d:p0,fill:'none',stroke:'#8a8a8a','stroke-width':1.5,'stroke-dasharray':'2 3'},left);
const dl=el('g',{},left),dr=el('g',{},right);
function draw(l){
  dl.innerHTML='';dr.innerHTML='';
  let p='';for(let i=0;i<=150;i++){const b=L.bmin+i/150*(L.bmax-L.bmin);p+=(i?'L':'M')+lx(b)+','+ly((b-0.4)**2+l*Math.abs(b));}
  el('path',{d:p,fill:'none',stroke:'#2a78d6','stroke-width':2.5},dl);
  const bh=Math.max(0,0.4-l/2),rg=0.4/(1+l);
  el('circle',{cx:lx(bh),cy:ly((bh-0.4)**2+l*bh),r:6,fill:'#2a78d6',stroke:'#fff','stroke-width':2},dl);
  if(bh===0)txt('tk',lx(0)+8,ly(0.16)+22,'stuck on the kink at 0',dl,'start');
  el('circle',{cx:rx(l),cy:ry(bh),r:6,fill:'#2a78d6',stroke:'#fff','stroke-width':2},dr);
  el('rect',{x:rx(l)-5,y:ry(rg)-5,width:10,height:10,fill:'#eb6834',stroke:'#fff','stroke-width':2},dr);
  document.getElementById('lk-lamout').textContent=l.toFixed(2);
  document.getElementById('lk-lo').textContent=bh===0?'0 (exactly)':bh.toFixed(3);
  document.getElementById('lk-ro').textContent=rg.toFixed(3);
  document.getElementById('lk-pp').textContent='0.80 vs. '+l.toFixed(2);
}
const s=document.getElementById('lk-lam');
s.addEventListener('input',()=>draw(parseFloat(s.value)));
draw(parseFloat(s.value));
})();
</script>
</div>
