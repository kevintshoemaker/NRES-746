<div class="w746" id="en">
<style>
.w746{--ink:#222;--ink2:#555;--muted:#8a8a8a;--card:#f4f4f2;--lasso:#2a78d6;--ridge:#eb6834;font-family:inherit;margin:1em 0 1.5em;max-width:720px}
.w746 .row{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.w746 .row label{color:var(--ink2);font-size:15px;margin:0;font-weight:400;min-width:110px}
.w746 input[type=range]{flex:1}
.w746 .val{font-weight:600;min-width:42px}
.w746 .cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-bottom:8px}
.w746 .card{background:var(--card);border-radius:8px;padding:8px 12px}
.w746 .card .k{font-size:13px;color:var(--ink2)}
.w746 .card .v{font-size:20px;font-weight:600;color:var(--ink)}
.w746 svg text{font-family:inherit}
.w746 .ax{stroke:var(--muted);stroke-width:1}
.w746 .lab{fill:var(--ink2);font-size:13px}
.w746 .tk{fill:var(--muted);font-size:11px}
.w746 .key{display:flex;flex-wrap:wrap;gap:16px;font-size:13px;color:var(--ink2)}
.w746 .key span{display:flex;align-items:center;gap:6px}
</style>
<div class="row">
  <label for="en-alpha">Mix &alpha;</label>
  <input type="range" id="en-alpha" min="0" max="1" step="0.05" value="0.5">
  <span class="val" id="en-alphaout">0.50</span>
</div>
<div class="row">
  <label for="en-lam">Penalty &lambda;</label>
  <input type="range" id="en-lam" min="0" max="4" step="0.05" value="1">
  <span class="val" id="en-lamout">1.00</span>
</div>
<div class="cards">
  <div class="card"><div class="k">Elastic net estimate</div><div class="v" id="en-est"></div></div>
  <div class="card"><div class="k">Price of the first unit vs. its worth</div><div class="v" id="en-fee" style="font-size:16px;margin-top:3px"></div></div>
  <div class="card"><div class="k">Estimate reaches 0 at</div><div class="v" id="en-zero" style="font-size:16px;margin-top:3px"></div></div>
</div>
<svg viewBox="0 0 680 295" width="100%" role="img" aria-label="Left: price of the next unit of beta and what it buys. Right: lasso, ridge, and elastic net estimates as lambda grows.">
  <text class="lab" x="185" y="15" text-anchor="middle">Next unit of &beta;: what it buys vs. what it costs</text>
  <text class="lab" x="528" y="15" text-anchor="middle">Estimate as &lambda; grows</text>
  <g id="en-left"></g><g id="en-right"></g>
</svg>
<div class="key">
  <span><svg width="24" height="6"><line x1="0" y1="3" x2="24" y2="3" stroke="#8a8a8a" stroke-width="2"/></svg>NLL drop per unit: 2(0.4 &minus; &beta;)</span>
  <span><svg width="24" height="6"><line x1="0" y1="3" x2="24" y2="3" stroke="#7a3fb0" stroke-width="3"/></svg>elastic net (current &alpha;)</span>
  <span><svg width="24" height="6"><line x1="0" y1="3" x2="24" y2="3" stroke="#2a78d6" stroke-width="2"/></svg>lasso (&alpha; = 1)</span>
  <span><svg width="24" height="6"><line x1="0" y1="3" x2="24" y2="3" stroke="#eb6834" stroke-width="2" stroke-dasharray="5 3"/></svg>ridge (&alpha; = 0)</span>
</div>
<script>
(function(){
const NS='http://www.w3.org/2000/svg';
function el(t,a,p){const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);p.appendChild(e);return e;}
function txt(cls,x,y,s,p,anchor){const t=el('text',{class:cls,x:x,y:y,'text-anchor':anchor||'middle'},p);t.textContent=s;return t;}
const EN='#7a3fb0';
const L={x0:50,x1:320,y0:255,y1:32,bmax:0.45,pmax:1.6};
const R={x0:398,x1:665,y0:255,y1:32,lmax:4,emax:0.42};
const lx=b=>L.x0+b/L.bmax*(L.x1-L.x0);
const ly=p=>L.y0-Math.min(p,L.pmax)/L.pmax*(L.y0-L.y1);
const rx=l=>R.x0+l/R.lmax*(R.x1-R.x0);
const ry=e=>R.y0-e/R.emax*(R.y0-R.y1);
// penalty lambda * [alpha |b| + (1 - alpha) b^2]; NLL (b - 0.4)^2
const est=(l,a)=>Math.max(0,0.4-l*a/2)/(1+l*(1-a));
const left=document.getElementById('en-left'),right=document.getElementById('en-right');
el('line',{class:'ax',x1:L.x0,y1:L.y0,x2:L.x1,y2:L.y0},left);
el('line',{class:'ax',x1:L.x0,y1:L.y0,x2:L.x0,y2:L.y1},left);
[0,0.1,0.2,0.3,0.4].forEach(b=>txt('tk',lx(b),L.y0+15,b.toFixed(1),left));
[0,0.4,0.8,1.2,1.6].forEach(p=>txt('tk',L.x0-6,ly(p)+4,p.toFixed(1),left,'end'));
txt('lab',(L.x0+L.x1)/2,288,'coefficient β bought so far',left);
el('line',{x1:lx(0),y1:ly(0.8),x2:lx(0.4),y2:ly(0),stroke:'#8a8a8a','stroke-width':2},left);
el('line',{class:'ax',x1:R.x0,y1:R.y0,x2:R.x1,y2:R.y0},right);
el('line',{class:'ax',x1:R.x0,y1:R.y0,x2:R.x0,y2:R.y1},right);
[0,1,2,3,4].forEach(l=>txt('tk',rx(l),R.y0+15,String(l),right));
[0,0.2,0.4].forEach(e=>txt('tk',R.x0-6,ry(e)+4,e.toFixed(1),right,'end'));
txt('lab',(R.x0+R.x1)/2,288,'penalty λ',right);
function path(f){let p='';for(let i=0;i<=200;i++){const l=i/200*R.lmax;p+=(i?'L':'M')+rx(l)+','+ry(f(l));}return p;}
el('path',{d:path(l=>est(l,1)),fill:'none',stroke:'#2a78d6','stroke-width':2},right);
el('path',{d:path(l=>est(l,0)),fill:'none',stroke:'#eb6834','stroke-width':2,'stroke-dasharray':'6 4'},right);
const dl=el('g',{},left),dr=el('g',{},right);
function draw(){
  const a=parseFloat(document.getElementById('en-alpha').value),l=parseFloat(document.getElementById('en-lam').value);
  dl.innerHTML='';dr.innerHTML='';
  const fee=l*a,slope=2*l*(1-a),bh=est(l,a);
  // price of the next unit: lambda * alpha + 2 * lambda * (1 - alpha) * b
  const bEnd=Math.min(L.bmax,slope>0?(L.pmax-fee)/slope:L.bmax);
  if(fee<=L.pmax)el('line',{x1:lx(0),y1:ly(fee),x2:lx(Math.max(0,bEnd)),y2:ly(fee+slope*Math.max(0,bEnd)),stroke:EN,'stroke-width':3},dl);
  else txt('tk',lx(0)+6,L.y1+8,'first unit costs '+fee.toFixed(2)+' (off scale)',dl,'start');
  el('line',{x1:lx(bh),y1:L.y0,x2:lx(bh),y2:ly(2*(0.4-bh)),stroke:EN,'stroke-width':1,'stroke-dasharray':'3 3'},dl);
  el('circle',{cx:lx(bh),cy:ly(bh>0?2*(0.4-bh):Math.min(fee,L.pmax)),r:6,fill:EN,stroke:'#fff','stroke-width':2},dl);
  if(bh===0)txt('tk',lx(0)+10,ly(Math.min(fee,L.pmax))+18,'not worth buying',dl,'start');
  el('path',{d:path(x=>est(x,a)),fill:'none',stroke:EN,'stroke-width':3},dr);
  if(a>0&&0.8/a<=R.lmax){el('line',{x1:rx(0.8/a),y1:R.y0,x2:rx(0.8/a),y2:R.y1,stroke:EN,'stroke-width':1,'stroke-dasharray':'2 3'},dr);}
  el('circle',{cx:rx(l),cy:ry(bh),r:6,fill:EN,stroke:'#fff','stroke-width':2},dr);
  document.getElementById('en-alphaout').textContent=a.toFixed(2);
  document.getElementById('en-lamout').textContent=l.toFixed(2);
  document.getElementById('en-est').textContent=bh===0?'0 (exactly)':bh.toFixed(3);
  document.getElementById('en-fee').textContent=fee.toFixed(2)+' vs. 0.80';
  document.getElementById('en-zero').textContent=a===0?'never (ridge)':'λ = '+(0.8/a).toFixed(2);
}
['en-alpha','en-lam'].forEach(id=>document.getElementById(id).addEventListener('input',draw));
draw();
})();
</script>
</div>
