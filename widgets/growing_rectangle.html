<div class="w746gr" id="grw">
<style>
.w746gr{--ink:#222;--ink2:#555;--card:#f4f4f2;font-family:inherit;margin:1em 0 1.5em;max-width:760px}
.w746gr .row{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-bottom:8px}
.w746gr .row label{color:var(--ink2);font-size:15px;margin:0;font-weight:400;min-width:170px}
.w746gr .row input[type=range]{flex:1;min-width:160px}
.w746gr .row output{font-weight:600;min-width:52px;text-align:right}
.w746gr button{font-size:14px;padding:4px 12px;border:1px solid #bbb;border-radius:6px;background:#fff;cursor:pointer}
.w746gr button:hover{background:#eee}
.w746gr button.on{background:#e6eef8;border-color:#7a9cc6}
.w746gr .cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:8px 0}
.w746gr .card{background:var(--card);border-radius:8px;padding:8px 12px}
.w746gr .card .k{font-size:13px;color:var(--ink2)}
.w746gr .card .v{font-size:17px;font-weight:600;color:var(--ink)}
.w746gr canvas{width:100%;height:auto;display:block}
.w746gr .note{font-size:14px;color:var(--ink2);margin:4px 0}
.w746gr .hide{display:none}
@media (max-width:600px){.w746gr .cards{grid-template-columns:repeat(2,minmax(0,1fr))}}
</style>
<div class="row">
  <button id="grw-msq">Square: area x&sup2;</button>
  <button id="grw-mre">Rectangle: area u &middot; v</button>
</div>
<div id="grw-sq">
  <div class="row"><label for="grw-x">Side, x</label><input type="range" id="grw-x" min="1" max="5" step="0.1" value="3"><output id="grw-x-o"></output></div>
  <div class="row"><label for="grw-dx">Change in side, dx</label><input type="range" id="grw-dx" min="0.02" max="1.5" step="0.02" value="0.6"><output id="grw-dx-o"></output></div>
</div>
<div id="grw-re" class="hide">
  <div class="row"><label for="grw-u">Width, u</label><input type="range" id="grw-u" min="1" max="5" step="0.1" value="4"><output id="grw-u-o"></output></div>
  <div class="row"><label for="grw-v">Height, v</label><input type="range" id="grw-v" min="1" max="4" step="0.1" value="2"><output id="grw-v-o"></output></div>
  <div class="row"><label for="grw-h">Step in x, h</label><input type="range" id="grw-h" min="0.02" max="1" step="0.02" value="0.5"><output id="grw-h-o"></output></div>
  <div class="row"><label for="grw-up">Rate u grows, u&prime;</label><input type="range" id="grw-up" min="0" max="2" step="0.1" value="1.2"><output id="grw-up-o"></output></div>
  <div class="row"><label for="grw-vp">Rate v grows, v&prime;</label><input type="range" id="grw-vp" min="0" max="2" step="0.1" value="0.6"><output id="grw-vp-o"></output></div>
</div>
<div class="cards">
  <div class="card"><div class="k">Exact change in area</div><div class="v" id="grw-c1"></div></div>
  <div class="card"><div class="k" id="grw-k2">Two strips</div><div class="v" id="grw-c2"></div></div>
  <div class="card"><div class="k">Corner piece</div><div class="v" id="grw-c3"></div></div>
  <div class="card"><div class="k">Corner as a share of the change</div><div class="v" id="grw-c4"></div></div>
</div>
<canvas id="grw-cv" width="760" height="330" role="img" aria-label="A grey square or rectangle with two blue strips and a red corner showing how its area grows."></canvas>
<p class="note" id="grw-note"></p>
<script>
(function(){
const $=id=>document.getElementById('grw-'+id);
let mode='sq';
function f(v,d){return (+v).toFixed(d===undefined?2:d);}
function draw(W0,H0,dW,dH,lab){
  const c=$('cv'),x=c.getContext('2d'),W=c.width,H=c.height;
  x.clearRect(0,0,W,H);x.fillStyle='#fff';x.fillRect(0,0,W,H);
  const s=Math.min((W-80)/7,(H-50)/6.5),ox=40,oy=H-25;
  const X=v=>ox+v*s,Y=v=>oy-v*s;
  x.fillStyle='#d9d9d9';x.fillRect(X(0),Y(H0),W0*s,H0*s);
  x.fillStyle='#7aa6d1';x.fillRect(X(W0),Y(H0),dW*s,H0*s);x.fillRect(X(0),Y(H0+dH),W0*s,dH*s);
  x.fillStyle='#c0392b';x.fillRect(X(W0),Y(H0+dH),dW*s,dH*s);
  x.strokeStyle='#333';x.lineWidth=1.5;x.strokeRect(X(0),Y(H0),W0*s,H0*s);
  x.lineWidth=1;x.strokeStyle='#666';x.strokeRect(X(0),Y(H0+dH),(W0+dW)*s,(H0+dH)*s);
  x.fillStyle='#222';x.font='15px sans-serif';x.textAlign='center';
  x.fillText(lab[0],X(W0/2),Y(H0/2)+5);
  x.font='13px sans-serif';
  if(dW*s>28){x.save();x.translate(X(W0+dW/2)+4,Y(H0/2));x.rotate(-Math.PI/2);x.fillText(lab[1],0,0);x.restore();}
  if(dH*s>16)x.fillText(lab[2],X(W0/2),Y(H0+dH/2)+5);
  x.fillStyle='#555';x.fillText(lab[3],X((W0+dW)/2),oy+18);
}
function update(){
  $('msq').classList.toggle('on',mode==='sq');$('mre').classList.toggle('on',mode==='re');
  $('sq').classList.toggle('hide',mode!=='sq');$('re').classList.toggle('hide',mode!=='re');
  let exact,strips,corner;
  if(mode==='sq'){
    const X=+$('x').value,d=+$('dx').value;$('x-o').textContent=f(X,1);$('dx-o').textContent=f(d);
    exact=(X+d)*(X+d)-X*X;strips=2*X*d;corner=d*d;
    $('k2').textContent='Two strips, 2x·dx';
    draw(X,X,d,d,['x²','x·dx','x·dx','side x = '+f(X,1)+', dx = '+f(d)]);
    $('note').textContent='Divide by dx: the strips give 2x = '+f(2*X)+' and the corner adds dx = '+f(d)+'. As dx shrinks toward 0, (change in area)/dx goes to 2x.';
  }else{
    const u=+$('u').value,v=+$('v').value,h=+$('h').value,up=+$('up').value,vp=+$('vp').value;
    ['u','v','h','up','vp'].forEach(k=>$(k+'-o').textContent=f($(k).value,k==='h'?2:1));
    const du=up*h,dv=vp*h;exact=(u+du)*(v+dv)-u*v;strips=v*du+u*dv;corner=du*dv;
    $('k2').textContent='Two strips, v·du + u·dv';
    draw(u,v,du,dv,['u·v','v·du','u·dv','du = u′h = '+f(du)+', dv = v′h = '+f(dv)]);
    $('note').textContent='Divide by h: the strips give u′v + uv′ = '+f(up*v+u*vp)+' and the corner adds u′v′h = '+f(up*vp*h)+', which vanishes as h shrinks.';
  }
  $('c1').textContent=f(exact,3);$('c2').textContent=f(strips,3);$('c3').textContent=f(corner,3);
  $('c4').textContent=exact>0?(100*corner/exact).toFixed(1)+'%':'0%';
}
$('msq').addEventListener('click',()=>{mode='sq';update();});
$('mre').addEventListener('click',()=>{mode='re';update();});
['x','dx','u','v','h','up','vp'].forEach(k=>$(k).addEventListener('input',update));
update();
})();
</script>
</div>
