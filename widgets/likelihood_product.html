<div class="w746lp" id="lpr">
<style>
.w746lp{--ink:#222;--ink2:#555;--card:#f4f4f2;font-family:inherit;margin:1em 0 1.5em;max-width:760px}
.w746lp .row{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-bottom:8px}
.w746lp .row label{color:var(--ink2);font-size:15px;margin:0;font-weight:400;min-width:150px}
.w746lp .row input[type=range]{flex:1;min-width:160px}
.w746lp .row output{font-weight:600;min-width:52px;text-align:right}
.w746lp button{font-size:14px;padding:4px 12px;border:1px solid #bbb;border-radius:6px;background:#fff;cursor:pointer}
.w746lp button:hover{background:#eee}
.w746lp button.on{background:#e6eef8;border-color:#7a9cc6}
.w746lp .cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:8px 0}
.w746lp .card{background:var(--card);border-radius:8px;padding:8px 12px}
.w746lp .card .k{font-size:13px;color:var(--ink2)}
.w746lp .card .v{font-size:17px;font-weight:600;color:var(--ink)}
.w746lp .plots{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.w746lp canvas{width:100%;height:auto;display:block}
.w746lp .probs{font-size:14px;color:var(--ink2);margin:4px 0 2px;font-family:monospace;overflow-wrap:anywhere}
@media (max-width:600px){.w746lp .plots{grid-template-columns:1fr}.w746lp .cards{grid-template-columns:repeat(2,minmax(0,1fr))}}
</style>
<div class="row">
  <span style="color:var(--ink2);font-size:14px">Data:</span>
  <button id="lpr-d1">Pika haypiles: 2, 5, 3, 0, 4, 4</button>
  <button id="lpr-d2">Four times as many plots</button>
  <button id="lpr-d3">Sparser plots: 1, 0, 2, 1, 0, 0</button>
</div>
<div class="row"><label for="lpr-lam">Candidate mean, &lambda;</label><input type="range" id="lpr-lam" min="0.2" max="8" step="0.05"><output id="lpr-lam-o"></output></div>
<div class="probs" id="lpr-probs"></div>
<div class="cards">
  <div class="card"><div class="k">Likelihood (product)</div><div class="v" id="lpr-lik"></div></div>
  <div class="card"><div class="k">Log-likelihood (sum)</div><div class="v" id="lpr-ll"></div></div>
  <div class="card"><div class="k">NLL</div><div class="v" id="lpr-nll"></div></div>
  <div class="card"><div class="k">MLE (sample mean)</div><div class="v" id="lpr-mle"></div></div>
</div>
<div class="plots">
  <canvas id="lpr-cv1" width="380" height="300" role="img" aria-label="Poisson probabilities for counts 0 to 12 at the chosen mean, with the observed counts marked."></canvas>
  <canvas id="lpr-cv2" width="380" height="300" role="img" aria-label="Negative log-likelihood across candidate means, with the chosen mean marked."></canvas>
</div>
<script>
(function(){
const $=id=>document.getElementById('lpr-'+id);
const sets={d1:[2,5,3,0,4,4],d2:[2,5,3,0,4,4,2,5,3,0,4,4,2,5,3,0,4,4,2,5,3,0,4,4],d3:[1,0,2,1,0,0]};
let data=sets.d1,cur='d1';
const lf=[0];for(let i=1;i<=40;i++)lf[i]=lf[i-1]+Math.log(i);
const logp=(y,l)=>y*Math.log(l)-l-lf[y];
const nll=l=>-data.reduce((s,y)=>s+logp(y,l),0);
function sci(v){if(v===0)return '0';const e=Math.floor(Math.log10(v));if(e>=-2)return v.toFixed(4);return (v/Math.pow(10,e)).toFixed(2)+'e'+e;}
function axes(ctx,W,H,pad,x0,x1,y0,y1,xl,yl,xt,yt){
  ctx.clearRect(0,0,W,H);ctx.fillStyle='#fff';ctx.fillRect(0,0,W,H);
  ctx.strokeStyle='#999';ctx.lineWidth=1;ctx.strokeRect(pad.l,pad.t,W-pad.l-pad.r,H-pad.t-pad.b);
  const sx=x=>pad.l+(x-x0)/(x1-x0)*(W-pad.l-pad.r),sy=y=>H-pad.b-(y-y0)/(y1-y0)*(H-pad.t-pad.b);
  ctx.fillStyle='#666';ctx.font='12px sans-serif';ctx.textAlign='center';
  xt.forEach(t=>ctx.fillText(t,sx(t),H-pad.b+15));ctx.fillText(xl,(pad.l+W-pad.r)/2,H-6);
  ctx.textAlign='right';yt.forEach(t=>ctx.fillText(t,pad.l-5,sy(t)+4));
  ctx.save();ctx.translate(12,(pad.t+H-pad.b)/2);ctx.rotate(-Math.PI/2);ctx.textAlign='center';ctx.fillText(yl,0,0);ctx.restore();
  return {sx,sy};
}
function draw(){
  ['d1','d2','d3'].forEach(k=>$(k).classList.toggle('on',k===cur));
  const l=+$('lam').value;$('lam-o').textContent=l.toFixed(2);
  const n=data.length,mle=data.reduce((a,b)=>a+b,0)/n;
  const ll=-nll(l);
  $('lik').textContent=sci(Math.exp(ll));$('ll').textContent=ll.toFixed(2);$('nll').textContent=(-ll).toFixed(2);
  $('mle').textContent=mle.toFixed(2);
  if(n<=6){$('probs').textContent='P(y) for each plot: '+data.map(y=>Math.exp(logp(y,l)).toFixed(3)).join(' × ')+' = '+sci(Math.exp(ll));}
  else{$('probs').textContent=n+' plots: the likelihood multiplies '+n+' probabilities, so it shrinks fast; the NLL adds '+n+' terms.';}
  // left: pmf bars with observed counts
  const c1=$('cv1'),x1=c1.getContext('2d'),W=c1.width,H=c1.height,pad={l:44,r:8,t:10,b:34};
  const ymax=Math.max(0.25,Math.ceil(Math.max(...Array.from({length:13},(_,y)=>Math.exp(logp(y,l))))*10+0.5)/10);
  const yt=[];for(let t=0;t<=ymax+1e-9;t+=ymax>0.5?0.2:0.1)yt.push(+t.toFixed(1));
  const A=axes(x1,W,H,pad,-0.7,12.7,0,ymax,'Count per plot','Probability',[0,2,4,6,8,10,12],yt);
  const counts={};data.forEach(y=>counts[y]=(counts[y]||0)+1);
  for(let y=0;y<=12;y++){const p=Math.exp(logp(y,l)),obs=counts[y];
    x1.fillStyle=obs?'#7a9cc6':'#ddd';x1.fillRect(A.sx(y-0.35),A.sy(p),A.sx(y+0.35)-A.sx(y-0.35),A.sy(0)-A.sy(p));
    if(obs){x1.fillStyle='#c0392b';x1.beginPath();x1.arc(A.sx(y),A.sy(p),4,0,2*Math.PI);x1.fill();
      if(obs>1){x1.fillStyle='#222';x1.font='12px sans-serif';x1.textAlign='center';x1.fillText('×'+obs,A.sx(y),A.sy(p)-8);}}}
  // right: NLL curve
  const c2=$('cv2'),x2=c2.getContext('2d');
  const ls=[];for(let i=0;i<=300;i++)ls.push(0.2+i/300*7.8);
  const vals=ls.map(nll),lo=Math.min(...vals),hi=Math.min(Math.max(...vals),lo+(n>6?80:25));
  const top=Math.ceil(hi/5)*5,bot=Math.floor(lo/5)*5,st=(top-bot)>40?20:5,yt2=[];for(let t=bot;t<=top;t+=st)yt2.push(t);
  const B=axes(x2,W,H,pad,0,8,bot,top,'Candidate mean, λ','Negative log-likelihood',[0,2,4,6,8],yt2);
  x2.save();x2.beginPath();x2.rect(pad.l,pad.t,W-pad.l-pad.r,H-pad.t-pad.b);x2.clip();
  x2.strokeStyle='#222';x2.lineWidth=2;x2.beginPath();ls.forEach((v,i)=>{const y=B.sy(vals[i]);i?x2.lineTo(B.sx(v),y):x2.moveTo(B.sx(v),y);});x2.stroke();
  x2.setLineDash([4,4]);x2.strokeStyle='#888';x2.lineWidth=1;x2.beginPath();x2.moveTo(B.sx(mle),pad.t);x2.lineTo(B.sx(mle),H-pad.b);x2.stroke();x2.setLineDash([]);
  x2.fillStyle='#c0392b';x2.beginPath();x2.arc(B.sx(l),B.sy(nll(l)),5,0,2*Math.PI);x2.fill();x2.restore();
}
function pick(k){cur=k;data=sets[k];draw();}
['d1','d2','d3'].forEach(k=>$(k).addEventListener('click',()=>pick(k)));
$('lam').addEventListener('input',draw);
$('lam').value=1.5;pick('d1');
})();
</script>
</div>
