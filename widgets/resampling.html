<div class="w746rs" id="rsw">
<style>
.w746rs{--ink:#222;--ink2:#555;--card:#f4f4f2;font-family:inherit;margin:1em 0 1.5em;max-width:760px}
.w746rs .row{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-bottom:8px}
.w746rs button{font-size:14px;padding:4px 12px;border:1px solid #bbb;border-radius:6px;background:#fff;cursor:pointer}
.w746rs button:hover{background:#eee}
.w746rs button.on{background:#e6eef8;border-color:#7a9cc6}
.w746rs .cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:8px 0}
.w746rs .card{background:var(--card);border-radius:8px;padding:8px 12px}
.w746rs .card .k{font-size:13px;color:var(--ink2)}
.w746rs .card .v{font-size:17px;font-weight:600;color:var(--ink)}
.w746rs canvas{width:100%;height:auto;display:block}
.w746rs .note{font-size:14px;color:var(--ink2);margin:4px 0}
.w746rs .lab{color:var(--ink2);font-size:14px}
@media (max-width:600px){.w746rs .cards{grid-template-columns:repeat(2,minmax(0,1fr))}}
</style>
<div class="row"><span class="lab">Example:</span>
  <button id="rsw-ms">Salmon: simulate new samples</button>
  <button id="rsw-ml">Lizards: shuffle the labels</button>
</div>
<p class="note" id="rsw-desc"></p>
<div class="row"><span class="lab">Add replicates:</span>
  <button id="rsw-a1">1</button>
  <button id="rsw-a100">100</button>
  <button id="rsw-a1000">1,000</button>
  <button id="rsw-a10000">10,000</button>
  <button id="rsw-reset">Reset</button>
</div>
<canvas id="rsw-cv1" width="760" height="120" role="img" aria-label="The data from the most recent replicate."></canvas>
<div class="cards">
  <div class="card"><div class="k">Replicates stored</div><div class="v" id="rsw-n"></div></div>
  <div class="card"><div class="k">Observed statistic</div><div class="v" id="rsw-obs"></div></div>
  <div class="card"><div class="k" id="rsw-kx">At least as extreme</div><div class="v" id="rsw-x"></div></div>
  <div class="card"><div class="k">Estimated p-value</div><div class="v" id="rsw-p"></div></div>
</div>
<canvas id="rsw-cv2" width="760" height="260" role="img" aria-label="Histogram of the stored statistics with the observed value marked."></canvas>
<script>
(function(){
const $=id=>document.getElementById('rsw-'+id);
const salmon=[3.14,3.27,2.56,3.77,3.34,4.32,3.84,2.19,5.24,3.09];
const trtA=[175,168,168,190,156,181,182,175,174,179],ctl=[185,169,173,173,188,186,175,174,179,180];
const mass=trtA.concat(ctl);
const mean=a=>a.reduce((s,v)=>s+v,0)/a.length;
const obsS=mean(salmon),obsL=mean(trtA)-mean(ctl);
let mode='s',stats=[],last=null;
function rnorm(m,s){let u=0,v=0;while(u===0)u=Math.random();v=Math.random();return m+s*Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v);}
function shuffle(a){const b=a.slice();for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]];}return b;}
function one(){
  if(mode==='s'){const d=[];for(let i=0;i<10;i++)d.push(rnorm(4.5,0.9));last=d;return mean(d);}
  const lab=shuffle(Array(10).fill('A').concat(Array(10).fill('C')));
  const a=[],c=[];mass.forEach((m,i)=>(lab[i]==='A'?a:c).push(m));last=lab;return mean(a)-mean(c);
}
function extreme(v){return mode==='s'?v<=obsS:Math.abs(v)>=Math.abs(obsL)-1e-9;}
function frame(cv,x0,x1,xl,ticks){
  const x=cv.getContext('2d'),W=cv.width,H=cv.height,pad={l:44,r:14,t:10,b:36};
  x.clearRect(0,0,W,H);x.fillStyle='#fff';x.fillRect(0,0,W,H);
  const sx=v=>pad.l+(v-x0)/(x1-x0)*(W-pad.l-pad.r);
  x.strokeStyle='#999';x.beginPath();x.moveTo(pad.l,H-pad.b);x.lineTo(W-pad.r,H-pad.b);x.stroke();
  x.fillStyle='#666';x.font='12px sans-serif';x.textAlign='center';
  ticks.forEach(t=>x.fillText(t,sx(t),H-pad.b+15));x.fillText(xl,(pad.l+W-pad.r)/2,H-5);
  return {x,W,H,pad,sx};
}
function drawData(){
  const cv=$('cv1');
  if(mode==='s'){
    const F=frame(cv,1.5,7,'Body mass (kg): the observed sample (top) and the latest simulated sample (bottom)',[2,3,4,5,6,7]),x=F.x;
    const row=(d,y,col,fill)=>d.forEach(v=>{x.beginPath();x.arc(F.sx(v),y,5,0,2*Math.PI);if(fill){x.fillStyle=col;x.fill();}else{x.strokeStyle=col;x.lineWidth=1.5;x.stroke();x.lineWidth=1;}});
    row(salmon,30,'#2c5d8a',true);
    x.strokeStyle='#2c5d8a';x.lineWidth=2;x.beginPath();x.moveTo(F.sx(obsS),18);x.lineTo(F.sx(obsS),42);x.stroke();
    if(last){row(last,62,'#888',false);const m=mean(last);x.strokeStyle='#888';x.beginPath();x.moveTo(F.sx(m),50);x.lineTo(F.sx(m),74);x.stroke();}
    x.lineWidth=1;
  }else{
    const F=frame(cv,150,195,'Body mass (g): filled = labeled trtA, open = labeled Control (top: real labels; bottom: latest shuffle)',[150,160,170,180,190]),x=F.x;
    const row=(lab,y)=>{const seen={};mass.forEach((m,i)=>{const k=m+lab[i];seen[k]=(seen[k]||0)+1;const yy=y-(seen[k]-1)*6;x.beginPath();x.arc(F.sx(m),yy,5,0,2*Math.PI);
      if(lab[i]==='A'){x.fillStyle='#c0392b';x.fill();}else{x.strokeStyle='#c0392b';x.lineWidth=1.5;x.stroke();x.lineWidth=1;}});};
    row(Array(10).fill('A').concat(Array(10).fill('C')),34);
    if(last)row(last,72);
  }
}
function drawHist(){
  const cv=$('cv2');
  // shuffled differences fall on a 0.2 g lattice, so lizard bins hold exactly two lattice values
  const S=mode==='s',x0=S?3:-12.1,x1=S?6:12.3,bw=S?0.05:0.4;
  const F=frame(cv,x0,x1,S?'Sample mean of 10 fish simulated under the null (kg)':'trtA mean minus Control mean after shuffling (g)',S?[3,3.5,4,4.5,5,5.5,6]:[-12,-8,-4,0,4,8,12]),x=F.x;
  const nb=Math.round((x1-x0)/bw),cnt=new Array(nb).fill(0),ext=new Array(nb).fill(0);
  stats.forEach(v=>{const b=Math.floor((v-x0)/bw);if(b>=0&&b<nb){cnt[b]++;if(extreme(v))ext[b]++;}});
  const mx=Math.max(1,...cnt),top=F.pad.t,base=F.H-F.pad.b,sy=c=>base-c/mx*(base-top);
  for(let b=0;b<nb;b++){if(!cnt[b])continue;const xa=F.sx(x0+b*bw),xb=F.sx(x0+(b+1)*bw);
    x.fillStyle='#cfd8e3';x.fillRect(xa,sy(cnt[b]),xb-xa-1,base-sy(cnt[b]));
    if(ext[b]){x.fillStyle='#e8a6a6';x.fillRect(xa,sy(ext[b]),xb-xa-1,base-sy(ext[b]));}}
  x.strokeStyle='#2c5d8a';x.lineWidth=2.5;
  const lines=S?[obsS]:[obsL,-obsL];
  lines.forEach((v,i)=>{x.setLineDash(i?[5,4]:[]);x.beginPath();x.moveTo(F.sx(v),top);x.lineTo(F.sx(v),base);x.stroke();});
  x.setLineDash([]);x.lineWidth=1;
  if(!stats.length){x.fillStyle='#888';x.font='13px sans-serif';x.textAlign='center';x.fillText('Add replicates to build the null distribution.',F.W/2,F.H/2);}
}
function update(){
  $('ms').classList.toggle('on',mode==='s');$('ml').classList.toggle('on',mode==='l');
  $('desc').textContent=mode==='s'?'Each replicate draws 10 masses from Normal(4.5, 0.9), the conventional-diet population, and stores their mean. One-tailed: we count simulated means at or below the observed mean.':'Each replicate shuffles the 20 group labels and stores the difference in group means. Two-tailed: we count differences at least as far from zero as the observed one, on either side (dashed line).';
  const k=stats.filter(extreme).length,n=stats.length;
  $('n').textContent=n.toLocaleString();
  $('obs').textContent=mode==='s'?obsS.toFixed(3)+' kg':obsL.toFixed(1)+' g';
  $('kx').textContent=mode==='s'?'Means at or below observed':'|Difference| at least 3.4';
  $('x').textContent=k.toLocaleString();
  $('p').textContent=n?(k===0?'< '+(1/n).toPrecision(2):(k/n).toPrecision(2)):'';
  drawData();drawHist();
}
function add(m){for(let i=0;i<m;i++)stats.push(one());update();}
$('ms').addEventListener('click',()=>{mode='s';stats=[];last=null;update();});
$('ml').addEventListener('click',()=>{mode='l';stats=[];last=null;update();});
[1,100,1000,10000].forEach(m=>$('a'+m).addEventListener('click',()=>add(m)));
$('reset').addEventListener('click',()=>{stats=[];last=null;update();});
update();
})();
</script>
</div>
