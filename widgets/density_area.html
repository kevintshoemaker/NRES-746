<div class="w746da" id="daw">
<style>
.w746da{--ink:#222;--ink2:#555;--card:#f4f4f2;font-family:inherit;margin:1em 0 1.5em;max-width:760px}
.w746da .row{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-bottom:8px}
.w746da .row label{color:var(--ink2);font-size:15px;margin:0;font-weight:400;min-width:190px}
.w746da .row input[type=range]{flex:1;min-width:160px}
.w746da .row output{font-weight:600;min-width:60px;text-align:right}
.w746da .cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:8px 0}
.w746da .card{background:var(--card);border-radius:8px;padding:8px 12px}
.w746da .card .k{font-size:13px;color:var(--ink2)}
.w746da .card .v{font-size:17px;font-weight:600;color:var(--ink)}
.w746da .plots{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.w746da canvas{width:100%;height:auto;display:block}
@media (max-width:600px){.w746da .plots{grid-template-columns:1fr}.w746da .cards{grid-template-columns:repeat(2,minmax(0,1fr))}}
</style>
<div class="row"><label for="daw-sd">Population SD, &sigma; (cm)</label><input type="range" id="daw-sd" min="0" max="1" step="0.001"><output id="daw-sd-o"></output></div>
<div class="row"><label for="daw-c">Interval center, c (cm)</label><input type="range" id="daw-c" min="10" max="34" step="0.1" value="22"><output id="daw-c-o"></output></div>
<div class="row"><label for="daw-w">Interval width, &Delta; (cm)</label><input type="range" id="daw-w" min="0" max="1" step="0.001"><output id="daw-w-o"></output></div>
<div class="cards">
  <div class="card"><div class="k">Height at c, f(c)</div><div class="v" id="daw-h"></div></div>
  <div class="card"><div class="k">Height &times; width</div><div class="v" id="daw-hw"></div></div>
  <div class="card"><div class="k">Area = P(in interval)</div><div class="v" id="daw-a"></div></div>
  <div class="card"><div class="k">Tallest height, f(22)</div><div class="v" id="daw-max"></div></div>
</div>
<div class="plots">
  <canvas id="daw-cv1" width="380" height="300" role="img" aria-label="Normal density curve for trout length with the chosen interval shaded."></canvas>
  <canvas id="daw-cv2" width="380" height="300" role="img" aria-label="Cumulative distribution function with the probability of the interval shown as a vertical gap."></canvas>
</div>
<script>
(function(){
const $=id=>document.getElementById('daw-'+id);
const MU=22;
// log-scale sliders: sd 0.1 to 8, width 0.01 to 12
const sdOf=u=>0.1*Math.pow(80,u), wOf=u=>0.01*Math.pow(1200,u);
const uOfSd=s=>Math.log(s/0.1)/Math.log(80), uOfW=w=>Math.log(w/0.01)/Math.log(1200);
$('sd').value=uOfSd(4);$('w').value=uOfW(4);
function erf(x){const s=x<0?-1:1;x=Math.abs(x);const t=1/(1+0.3275911*x);
  const y=1-(((((1.061405429*t-1.453152027)*t)+1.421413741)*t-0.284496736)*t+0.254829592)*t*Math.exp(-x*x);return s*y;}
const pdf=(x,s)=>Math.exp(-0.5*((x-MU)/s)**2)/(s*Math.sqrt(2*Math.PI));
const cdf=(x,s)=>0.5*(1+erf((x-MU)/(s*Math.SQRT2)));
function f(v){if(v>=100)return v.toFixed(0);if(v>=1)return v.toFixed(2);if(v>=0.001)return v.toFixed(3);if(v===0)return '0';return v.toExponential(1);}
function axes(ctx,W,H,pad,x0,x1,y0,y1,xl,yl,xt,yt,yfmt){
  ctx.clearRect(0,0,W,H);ctx.fillStyle='#fff';ctx.fillRect(0,0,W,H);
  ctx.strokeStyle='#999';ctx.lineWidth=1;ctx.strokeRect(pad.l,pad.t,W-pad.l-pad.r,H-pad.t-pad.b);
  const sx=x=>pad.l+(x-x0)/(x1-x0)*(W-pad.l-pad.r),sy=y=>H-pad.b-(y-y0)/(y1-y0)*(H-pad.t-pad.b);
  ctx.fillStyle='#666';ctx.font='12px sans-serif';ctx.textAlign='center';
  xt.forEach(t=>ctx.fillText(t,sx(t),H-pad.b+15));ctx.fillText(xl,(pad.l+W-pad.r)/2,H-6);
  ctx.textAlign='right';yt.forEach(t=>ctx.fillText(yfmt?yfmt(t):t,pad.l-5,sy(t)+4));
  ctx.save();ctx.translate(12,(pad.t+H-pad.b)/2);ctx.rotate(-Math.PI/2);ctx.textAlign='center';ctx.fillText(yl,0,0);ctx.restore();
  return {sx,sy};
}
function niceTicks(top){const raw=top/4,mag=Math.pow(10,Math.floor(Math.log10(raw))),r=raw/mag;
  const st=(r<1.5?1:r<3?2:r<7?5:10)*mag;const out=[];for(let t=0;t<=top+1e-12;t+=st)out.push(+t.toPrecision(6));return out;}
function draw(){
  const s=sdOf(+$('sd').value),c=+$('c').value,w=wOf(+$('w').value);
  $('sd-o').textContent=s<1?s.toFixed(2):s.toFixed(1);$('c-o').textContent=c.toFixed(1);$('w-o').textContent=w<0.1?w.toFixed(3):w<1?w.toFixed(2):w.toFixed(1);
  const a=c-w/2,b=c+w/2,h=pdf(c,s),area=cdf(b,s)-cdf(a,s),top=pdf(MU,s);
  $('h').textContent=f(h);$('hw').textContent=f(h*w);$('a').textContent=f(area);$('max').textContent=f(top);
  const x0=10,x1=34;
  // density panel
  const c1=$('cv1'),g=c1.getContext('2d'),W=c1.width,H=c1.height,pad={l:48,r:8,t:10,b:34};
  const ymax=top*1.08,yt=niceTicks(ymax);
  const A=axes(g,W,H,pad,x0,x1,0,Math.max(ymax,yt[yt.length-1]),'Trout length (cm)','Density (per cm)',[10,14,18,22,26,30,34],yt);
  const N=600,xs=[];for(let i=0;i<=N;i++)xs.push(x0+i/N*(x1-x0));
  for(let i=0;i<=400;i++){const xx=MU-5*s+i/400*10*s;if(xx>x0&&xx<x1)xs.push(xx);}
  xs.sort((u,v)=>u-v);
  const lo=Math.max(a,x0),hi=Math.min(b,x1);
  if(hi>lo){g.fillStyle='rgba(122,156,198,0.55)';g.beginPath();g.moveTo(A.sx(lo),A.sy(0));
    const M=200;for(let i=0;i<=M;i++){const xx=lo+i/M*(hi-lo);g.lineTo(A.sx(xx),A.sy(pdf(xx,s)));}
    g.lineTo(A.sx(hi),A.sy(0));g.closePath();g.fill();
    g.strokeStyle='#2c5d8a';g.setLineDash([4,3]);g.beginPath();g.moveTo(A.sx(lo),A.sy(0));g.lineTo(A.sx(lo),A.sy(h));g.lineTo(A.sx(hi),A.sy(h));g.lineTo(A.sx(hi),A.sy(0));g.stroke();g.setLineDash([]);}
  g.strokeStyle='#222';g.lineWidth=2;g.beginPath();xs.forEach((xx,i)=>{const yy=A.sy(pdf(xx,s));i?g.lineTo(A.sx(xx),yy):g.moveTo(A.sx(xx),yy);});g.stroke();g.lineWidth=1;
  if(top>1){g.strokeStyle='#c0392b';g.setLineDash([2,3]);g.beginPath();g.moveTo(A.sx(x0),A.sy(1));g.lineTo(A.sx(x1),A.sy(1));g.stroke();g.setLineDash([]);
    g.fillStyle='#c0392b';g.font='12px sans-serif';g.textAlign='left';g.fillText('height 1',A.sx(x0)+4,A.sy(1)-4);}
  // CDF panel
  const c2=$('cv2'),q=c2.getContext('2d');
  const B=axes(q,W,H,pad,x0,x1,0,1,'Trout length (cm)','Cumulative probability, F(x)',[10,14,18,22,26,30,34],[0,0.25,0.5,0.75,1]);
  q.strokeStyle='#222';q.lineWidth=2;q.beginPath();xs.forEach((xx,i)=>{const yy=B.sy(cdf(xx,s));i?q.lineTo(B.sx(xx),yy):q.moveTo(B.sx(xx),yy);});q.stroke();q.lineWidth=1;
  const Fa=cdf(a,s),Fb=cdf(b,s);
  q.strokeStyle='#888';q.setLineDash([3,3]);
  [[a,Fa],[b,Fb]].forEach(([xx,F])=>{if(xx>=x0&&xx<=x1){q.beginPath();q.moveTo(B.sx(xx),B.sy(0));q.lineTo(B.sx(xx),B.sy(F));q.lineTo(B.sx(x0),B.sy(F));q.stroke();}});
  q.setLineDash([]);
  q.strokeStyle='#2c5d8a';q.lineWidth=5;q.beginPath();q.moveTo(B.sx(x0)+6,B.sy(Fa));q.lineTo(B.sx(x0)+6,B.sy(Fb));q.stroke();q.lineWidth=1;
  q.fillStyle='#2c5d8a';q.font='12px sans-serif';q.textAlign='left';q.fillText('F(c+Δ/2) − F(c−Δ/2) = '+f(area),B.sx(x0)+12,B.sy(Math.min(0.95,(Fa+Fb)/2+0.04)));
}
['sd','c','w'].forEach(k=>$(k).addEventListener('input',draw));
draw();
})();
</script>
</div>
