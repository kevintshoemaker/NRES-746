<div class="w746dx" id="dxw">
<style>
.w746dx{--ink:#222;--ink2:#555;--card:#f4f4f2;font-family:inherit;margin:1em 0 1.5em;max-width:760px}
.w746dx .row{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:8px}
.w746dx .row label{color:var(--ink2);font-size:15px;margin:0;font-weight:400;min-width:170px}
.w746dx .row input[type=range]{flex:1;min-width:160px}
.w746dx .row output{font-weight:600;min-width:52px;text-align:right}
.w746dx button{font-size:14px;padding:4px 10px;border:1px solid #bbb;border-radius:6px;background:#fff;cursor:pointer}
.w746dx button:hover{background:#eee}
.w746dx button.on{background:#e6eef8;border-color:#7a9cc6}
.w746dx .cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:8px 0}
.w746dx .card{background:var(--card);border-radius:8px;padding:8px 12px}
.w746dx .card .k{font-size:13px;color:var(--ink2)}
.w746dx .card .v{font-size:17px;font-weight:600;color:var(--ink)}
.w746dx canvas{width:100%;height:auto;display:block}
.w746dx .note{font-size:14px;color:var(--ink2);margin:4px 0}
@media (max-width:600px){.w746dx .cards{grid-template-columns:repeat(2,minmax(0,1fr))}}
</style>
<div class="row" id="dxw-btns"></div>
<div class="note" id="dxw-desc"></div>
<div class="row"><label id="dxw-l1" for="dxw-p1"></label><input type="range" id="dxw-p1"><output id="dxw-p1-o"></output></div>
<div class="row" id="dxw-r2"><label id="dxw-l2" for="dxw-p2"></label><input type="range" id="dxw-p2"><output id="dxw-p2-o"></output></div>
<div class="cards">
  <div class="card"><div class="k">Mean</div><div class="v" id="dxw-mean"></div></div>
  <div class="card"><div class="k">Variance</div><div class="v" id="dxw-var"></div></div>
  <div class="card"><div class="k">Variance / mean</div><div class="v" id="dxw-vm"></div></div>
  <div class="card"><div class="k">CV (SD / mean)</div><div class="v" id="dxw-cv"></div></div>
</div>
<canvas id="dxw-cv1" width="760" height="320" role="img" aria-label="Probability mass or density of the chosen distribution, with the mean and one standard deviation either side marked."></canvas>
<div class="row" style="margin-top:8px">
  <button id="dxw-draw">Draw 200 values</button>
  <button id="dxw-clear">Clear draws</button>
  <span class="note" id="dxw-samp"></span>
</div>
<script>
(function(){
const $=id=>document.getElementById('dxw-'+id);
// log-gamma (Lanczos)
const LG=[676.5203681218851,-1259.1392167224028,771.32342877765313,-176.61502916214059,12.507343278686905,-0.13857109526572012,9.9843695780195716e-6,1.5056327351493116e-7];
function lgamma(z){if(z<0.5)return Math.log(Math.PI/Math.abs(Math.sin(Math.PI*z)))-lgamma(1-z);
  z-=1;let x=0.99999999999980993;for(let i=0;i<8;i++)x+=LG[i]/(z+i+1);const t=z+7.5;
  return 0.5*Math.log(2*Math.PI)+(z+0.5)*Math.log(t)-t+Math.log(x);}
function rnorm(){let u=0;while(u===0)u=Math.random();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*Math.random());}
function rgamma(a){if(a<1)return rgamma(1+a)*Math.pow(Math.random(),1/a);
  const d=a-1/3,c=1/Math.sqrt(9*d);for(;;){let x,v;do{x=rnorm();v=1+c*x;}while(v<=0);v=v*v*v;const u=Math.random();
  if(u<1-0.0331*x*x*x*x||Math.log(u)<0.5*x*x+d*(1-v+Math.log(v)))return d*v;}}
function rpois(l){if(l>500)return Math.max(0,Math.round(l+Math.sqrt(l)*rnorm()));
  const L=Math.exp(-l);let k=0,p=1;do{k++;p*=Math.random();}while(p>L);return k-1;}
const D={
 binom:{name:'Binomial',kind:'d',desc:'Successes in N independent trials, each with probability p. Bounded: 0 to N.',
   p:[{lab:'Trials, N',min:1,max:50,step:1,val:6,f:0},{lab:'Probability, p',min:0.01,max:0.99,step:0.01,val:0.25,f:2}],
   lpmf:(x,[N,p])=>x>N?-Infinity:lgamma(N+1)-lgamma(x+1)-lgamma(N-x+1)+x*Math.log(p)+(N-x)*Math.log(1-p),
   m:([N,p])=>[N*p,N*p*(1-p)],r:([N,p])=>{let k=0;for(let i=0;i<N;i++)if(Math.random()<p)k++;return k;},hi:([N])=>N},
 pois:{name:'Poisson',kind:'d',desc:'Counts of independent events at a constant rate, with no upper limit. Variance equals the mean.',
   p:[{lab:'Mean, λ',min:0.1,max:30,step:0.1,val:4,f:1}],
   lpmf:(x,[l])=>x*Math.log(l)-l-lgamma(x+1),m:([l])=>[l,l],r:([l])=>rpois(l)},
 nbinom:{name:'Negative binomial',kind:'d',desc:'Counts that are clumped or more variable than a Poisson. Variance = μ + μ²/k; large k approaches the Poisson.',
   p:[{lab:'Mean, μ',min:0.1,max:30,step:0.1,val:4,f:1},{lab:'Overdispersion, k',min:0.1,max:50,step:0.1,val:1.5,f:1}],
   lpmf:(x,[mu,k])=>lgamma(x+k)-lgamma(k)-lgamma(x+1)+k*Math.log(k/(k+mu))+x*Math.log(mu/(k+mu)),
   m:([mu,k])=>[mu,mu+mu*mu/k],r:([mu,k])=>rpois(rgamma(k)*mu/k)},
 norm:{name:'Normal',kind:'c',desc:'Symmetric and unbounded. The mean and SD are its two parameters, and the variance does not depend on the mean.',
   p:[{lab:'Mean, μ',min:0,max:30,step:0.1,val:22,f:1},{lab:'SD, σ',min:0.2,max:10,step:0.1,val:4,f:1}],
   pdf:(x,[mu,s])=>Math.exp(-0.5*((x-mu)/s)**2)/(s*Math.sqrt(2*Math.PI)),m:([mu,s])=>[mu,s*s],r:([mu,s])=>mu+s*rnorm(),
   rng:([mu,s])=>[mu-4*s,mu+4*s]},
 gamma:{name:'Gamma',kind:'c',desc:'Positive and right-skewed (Bolker’s shape a and scale s). Mean = as, variance = as², so CV = 1/√a.',
   p:[{lab:'Shape, a',min:0.2,max:20,step:0.1,val:2,f:1},{lab:'Scale, s',min:0.1,max:10,step:0.1,val:2,f:1}],
   pdf:(x,[a,s])=>x<=0?0:Math.exp((a-1)*Math.log(x)-x/s-lgamma(a)-a*Math.log(s)),m:([a,s])=>[a*s,a*s*s],r:([a,s])=>rgamma(a)*s,
   rng:([a,s])=>[0,a*s+5*Math.sqrt(a)*s]},
 exp:{name:'Exponential',kind:'c',desc:'Waiting times between independent events at rate r. A gamma with shape 1; mean 1/r and CV 1.',
   p:[{lab:'Rate, r',min:0.05,max:5,step:0.05,val:1.5,f:2}],
   pdf:(x,[r])=>x<0?0:r*Math.exp(-r*x),m:([r])=>[1/r,1/(r*r)],r:([r])=>-Math.log(1-Math.random())/r,rng:([r])=>[0,6/r]},
 lnorm:{name:'Lognormal',kind:'c',desc:'Positive and right-skewed; log(X) is normal with mean m and SD s on the log scale. The SD grows in proportion to the mean.',
   p:[{lab:'Log-scale mean, m',min:-1,max:4,step:0.05,val:2,f:2},{lab:'Log-scale SD, s',min:0.05,max:1.5,step:0.05,val:0.5,f:2}],
   pdf:(x,[m,s])=>x<=0?0:Math.exp(-0.5*((Math.log(x)-m)/s)**2)/(x*s*Math.sqrt(2*Math.PI)),
   m:([m,s])=>{const mu=Math.exp(m+s*s/2);return [mu,(Math.exp(s*s)-1)*mu*mu];},r:([m,s])=>Math.exp(m+s*rnorm()),
   rng:([m,s])=>[0,Math.exp(m+3*s)]},
 beta:{name:'Beta',kind:'c',desc:'Proportions and probabilities, bounded between 0 and 1. Mean = a/(a + b).',
   p:[{lab:'Shape 1, a',min:0.1,max:20,step:0.1,val:2,f:1},{lab:'Shape 2, b',min:0.1,max:20,step:0.1,val:5,f:1}],
   pdf:(x,[a,b])=>(x<=0||x>=1)?0:Math.exp((a-1)*Math.log(x)+(b-1)*Math.log(1-x)+lgamma(a+b)-lgamma(a)-lgamma(b)),
   m:([a,b])=>[a/(a+b),a*b/((a+b)**2*(a+b+1))],r:([a,b])=>{const g1=rgamma(a),g2=rgamma(b);return g1/(g1+g2);},rng:()=>[0,1]}
};
let cur='nbinom',draws=null;
const btns=$('btns');
Object.keys(D).forEach(k=>{const b=document.createElement('button');b.textContent=D[k].name;b.id='dxw-b-'+k;
  b.addEventListener('click',()=>{cur=k;draws=null;setup();});btns.appendChild(b);});
function fmt(v,d){if(!isFinite(v))return '—';const a=Math.abs(v);if(a>=1000)return v.toFixed(0);if(a>=10)return v.toFixed(1);if(a>=1)return v.toFixed(2);return v.toFixed(3);}
function setup(){
  const d=D[cur];Object.keys(D).forEach(k=>$('b-'+k).classList.toggle('on',k===cur));$('desc').textContent=d.desc;
  [0,1].forEach(i=>{const s=d.p[i],el=$('p'+(i+1));
    if(!s){if(i===1)$('r2').style.display='none';return;}if(i===1)$('r2').style.display='';
    $('l'+(i+1)).textContent=s.lab;el.min=s.min;el.max=s.max;el.step=s.step;el.value=s.val;});
  draw();
}
function pars(){return D[cur].p.map((s,i)=>+$('p'+(i+1)).value);}
function axes(ctx,W,H,pad,x0,x1,y0,y1,xl,yl,xt,yt){
  ctx.clearRect(0,0,W,H);ctx.fillStyle='#fff';ctx.fillRect(0,0,W,H);
  ctx.strokeStyle='#999';ctx.lineWidth=1;ctx.strokeRect(pad.l,pad.t,W-pad.l-pad.r,H-pad.t-pad.b);
  const sx=x=>pad.l+(x-x0)/(x1-x0)*(W-pad.l-pad.r),sy=y=>H-pad.b-(y-y0)/(y1-y0)*(H-pad.t-pad.b);
  ctx.fillStyle='#666';ctx.font='12px sans-serif';ctx.textAlign='center';
  xt.forEach(t=>ctx.fillText(+t.toPrecision(4),sx(t),H-pad.b+15));ctx.fillText(xl,(pad.l+W-pad.r)/2,H-6);
  ctx.textAlign='right';yt.forEach(t=>ctx.fillText(+t.toPrecision(3),pad.l-5,sy(t)+4));
  ctx.save();ctx.translate(12,(pad.t+H-pad.b)/2);ctx.rotate(-Math.PI/2);ctx.textAlign='center';ctx.fillText(yl,0,0);ctx.restore();
  return {sx,sy};
}
function ticks(lo,hi,n){const raw=(hi-lo)/n,mag=Math.pow(10,Math.floor(Math.log10(raw))),r=raw/mag;
  const st=(r<1.5?1:r<3?2:r<7?5:10)*mag;const out=[];for(let t=Math.ceil(lo/st)*st;t<=hi+1e-9;t+=st)out.push(+t.toPrecision(8));return out;}
function draw(){
  const d=D[cur],p=pars();
  d.p.forEach((s,i)=>$('p'+(i+1)+'-o').textContent=(+$('p'+(i+1)).value).toFixed(s.f));
  const [mu,v]=d.m(p),sd=Math.sqrt(v);
  $('mean').textContent=fmt(mu);$('var').textContent=fmt(v);$('vm').textContent=fmt(v/mu);$('cv').textContent=fmt(sd/mu);
  const c=$('cv1'),g=c.getContext('2d'),W=c.width,H=c.height,pad={l:52,r:12,t:12,b:36};
  if(d.kind==='d'){
    let hi=d.hi?d.hi(p):Math.ceil(mu+5*sd+2);hi=Math.max(hi,5);if(!d.hi)hi=Math.min(hi,200);
    const xs=[],ps=[];for(let x=0;x<=hi;x++){xs.push(x);ps.push(Math.exp(d.lpmf(x,p)));}
    let top=Math.max(...ps);if(draws){const fr=freq(hi);top=Math.max(top,...fr);}
    const A=axes(g,W,H,pad,-0.7,hi+0.7,0,top*1.1,'Value (a count)','Probability',ticks(0,hi,8).filter(t=>Number.isInteger(t)),ticks(0,top*1.1,4));
    const bw=0.7;
    g.fillStyle='#9fb6d3';xs.forEach((x,i)=>{g.fillRect(A.sx(x-bw/2),A.sy(ps[i]),A.sx(x+bw/2)-A.sx(x-bw/2),A.sy(0)-A.sy(ps[i]));});
    if(draws){const fr=freq(hi);g.fillStyle='#c0392b';fr.forEach((f,x)=>{if(f>0){g.beginPath();g.arc(A.sx(x),A.sy(f),3.5,0,2*Math.PI);g.fill();}});}
    marks(g,A,mu,sd,top*1.1);
  }else{
    const [lo,hi]=d.rng(p),N=500,xs=[],fs=[];
    for(let i=0;i<=N;i++){const x=lo+i/N*(hi-lo);xs.push(x);fs.push(d.pdf(x,p));}
    const inner=fs.slice(Math.floor(N*0.03),Math.ceil(N*0.97)+1).filter(isFinite);let top=Math.max(...inner,1e-9);
    if(cur==='norm'||cur==='lnorm')top=Math.max(...fs.filter(isFinite));
    let hist=null;if(draws){hist=histo(lo,hi);top=Math.max(top,...hist.dens);}
    const ymax=top*1.1;
    const A=axes(g,W,H,pad,lo,hi,0,ymax,'Value','Density',ticks(lo,hi,8),ticks(0,ymax,4));
    if(hist){g.strokeStyle='#c0392b';g.lineWidth=1.5;g.beginPath();hist.dens.forEach((dd,i)=>{const a=hist.edges[i],b=hist.edges[i+1];
      g.moveTo(A.sx(a),A.sy(0));g.lineTo(A.sx(a),A.sy(Math.min(dd,ymax)));g.lineTo(A.sx(b),A.sy(Math.min(dd,ymax)));g.lineTo(A.sx(b),A.sy(0));});g.stroke();g.lineWidth=1;}
    g.save();g.beginPath();g.rect(pad.l,pad.t,W-pad.l-pad.r,H-pad.t-pad.b);g.clip();
    g.strokeStyle='#2c5d8a';g.lineWidth=2.5;g.beginPath();let started=false;
    xs.forEach((x,i)=>{const f=fs[i];if(!isFinite(f))return;const yy=A.sy(Math.min(f,ymax*1.5));started?g.lineTo(A.sx(x),yy):(g.moveTo(A.sx(x),yy),started=true);});g.stroke();g.restore();g.lineWidth=1;
    marks(g,A,mu,sd,ymax);
  }
  if(draws){const n=draws.length,m=draws.reduce((a,b)=>a+b,0)/n,s2=draws.reduce((a,b)=>a+(b-m)**2,0)/(n-1);
    $('samp').textContent='200 draws (red): sample mean '+fmt(m)+', sample variance '+fmt(s2)+'.';}else $('samp').textContent='';
}
function marks(g,A,mu,sd,ymax){
  const c=g.canvas;g.save();g.beginPath();g.rect(52,12,c.width-64,c.height-48);g.clip();
  g.strokeStyle='#222';g.setLineDash([5,4]);g.beginPath();g.moveTo(A.sx(mu),A.sy(0));g.lineTo(A.sx(mu),A.sy(ymax*0.97));g.stroke();g.setLineDash([]);
  const y=A.sy(ymax*0.92);g.beginPath();g.moveTo(A.sx(mu-sd),y);g.lineTo(A.sx(mu+sd),y);g.stroke();
  [mu-sd,mu+sd].forEach(x=>{g.beginPath();g.moveTo(A.sx(x),y-4);g.lineTo(A.sx(x),y+4);g.stroke();});
  g.fillStyle='#222';g.font='12px sans-serif';g.textAlign='left';g.fillText('mean ± 1 SD',A.sx(mu+sd)+6,y+4);
  g.restore();
}
function freq(hi){const f=new Array(hi+1).fill(0);draws.forEach(x=>{if(x<=hi)f[x]+=1/draws.length;});return f;}
function histo(lo,hi){const B=30,w=(hi-lo)/B,edges=[],cnt=new Array(B).fill(0);for(let i=0;i<=B;i++)edges.push(lo+i*w);
  draws.forEach(x=>{const i=Math.floor((x-lo)/w);if(i>=0&&i<B)cnt[i]++;});return {edges,dens:cnt.map(c=>c/(draws.length*w))};}
$('p1').addEventListener('input',()=>{draws=null;draw();});$('p2').addEventListener('input',()=>{draws=null;draw();});
$('draw').addEventListener('click',()=>{const d=D[cur],p=pars();draws=[];for(let i=0;i<200;i++)draws.push(d.r(p));draw();});
$('clear').addEventListener('click',()=>{draws=null;draw();});
setup();
})();
</script>
</div>
