<div class="w746" id="saw">
<style>
.w746{--ink:#222;--ink2:#555;--muted:#8a8a8a;--card:#f4f4f2;font-family:inherit;margin:1em 0 1.5em;max-width:720px}
.w746 .row{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-bottom:8px}
.w746 .row label{color:var(--ink2);font-size:15px;margin:0;font-weight:400;min-width:150px}
.w746 input[type=range]{flex:1;min-width:140px}
.w746 .val{font-weight:600;min-width:48px}
.w746 button{font-size:14px;padding:4px 12px;border:1px solid #bbb;border-radius:6px;background:#fff;cursor:pointer}
.w746 button:hover{background:#eee}
.w746 .cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:8px 0}
.w746 .card{background:var(--card);border-radius:8px;padding:8px 12px}
.w746 .card .k{font-size:13px;color:var(--ink2)}
.w746 .card .v{font-size:19px;font-weight:600;color:var(--ink)}
.w746 canvas{width:100%;height:auto;display:block}
.w746 .note{font-size:13px;color:var(--ink2);margin-top:4px}
</style>
<div class="row">
  <label for="saw-t0">Starting temperature T</label>
  <input type="range" id="saw-t0" min="-2" max="1.3" step="0.05" value="0.3">
  <span class="val" id="saw-t0o"></span>
</div>
<div class="row">
  <label for="saw-cool">Cooling: T &times; this every 100 steps</label>
  <input type="range" id="saw-cool" min="0.7" max="1" step="0.01" value="0.85">
  <span class="val" id="saw-coolo"></span>
</div>
<div class="row">
  <button id="saw-run">Run 3,000 steps</button>
  <button id="saw-seed">New random numbers</button>
  <span class="note">Starts at x = 2 (the shallow valley). Proposals: x + Normal(0, 0.4).</span>
</div>
<div class="cards">
  <div class="card"><div class="k">Final temperature</div><div class="v" id="saw-tf"></div></div>
  <div class="card"><div class="k">Best x found</div><div class="v" id="saw-best"></div></div>
  <div class="card"><div class="k">Uphill moves accepted</div><div class="v" id="saw-up"></div></div>
  <div class="card"><div class="k">Last 1,000 steps in deep valley</div><div class="v" id="saw-deep"></div></div>
</div>
<canvas id="saw-cv" width="680" height="430" role="img" aria-label="Top left: the curve with two valleys and the points visited. Top right: position over time. Bottom: histogram of positions visited."></canvas>
<div class="note">Bottom panel: where the chain spent its last 1,000 steps. With cooling set to 1 (never cool) the orange curve shows e<sup>&minus;f(x)/T</sup>, scaled to match.</div>
<script>
(function(){
// two valleys: deep one near x = -2, shallow one near x = 2
const f=x=>0.15*(x*x-4)**2+0.5*x;
const XL=[-3.6,3.6];
function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
let seed=7,run=null,anim=null;
const cv=document.getElementById('saw-cv'),ctx=cv.getContext('2d'),W=cv.width;
const P1={x0:40,x1:330,y0:200,y1:14},P2={x0:380,x1:670,y0:200,y1:14},P3={x0:40,x1:670,y0:400,y1:262};
const fmin=-1.1,fmax=3.2,N=3000;
function axes(P,xl,yl){ctx.strokeStyle='#999';ctx.lineWidth=1;ctx.strokeRect(P.x0,P.y1,P.x1-P.x0,P.y0-P.y1);
  ctx.fillStyle='#555';ctx.font='12px sans-serif';ctx.textAlign='center';ctx.fillText(xl,(P.x0+P.x1)/2,P.y0+28);
  ctx.save();ctx.translate(P.x0-26,(P.y0+P.y1)/2);ctx.rotate(-Math.PI/2);ctx.fillText(yl,0,0);ctx.restore();}
const px=(P,x)=>P.x0+(x-XL[0])/(XL[1]-XL[0])*(P.x1-P.x0);
function simulate(){
  const T0=10**(+document.getElementById('saw-t0').value),c=+document.getElementById('saw-cool').value,u=rng(seed);
  const norm=()=>Math.sqrt(-2*Math.log(u()+1e-12))*Math.cos(2*Math.PI*u());
  let x=2,fx=f(x),T=T0,best=x,fb=fx,up=0,upTried=0;const xs=[],Ts=[];
  for(let i=0;i<N;i++){
    const y=x+0.4*norm(),fy=f(y),d=fy-fx;
    if(d>0)upTried++;
    if(Math.abs(y)<XL[1]&&(d<=0||u()<Math.exp(-d/T))){if(d>0)up++;x=y;fx=fy;}
    if(fx<fb){best=x;fb=fx;}
    xs.push(x);Ts.push(T);if((i+1)%100===0)T*=c;
  }
  return {xs,Ts,best,up,upTried,T0,c,Tf:T};
}
function draw(r,n){
  ctx.clearRect(0,0,W,cv.height);
  axes(P1,'x','f(x)');axes(P2,'step','x');axes(P3,'x','visits');
  // curve
  const fy=v=>P1.y0-(v-fmin)/(fmax-fmin)*(P1.y0-P1.y1);
  ctx.strokeStyle='#222';ctx.lineWidth=2;ctx.beginPath();
  for(let i=0;i<=200;i++){const x=XL[0]+i/200*(XL[1]-XL[0]);const y=Math.max(P1.y1,fy(f(x)));i?ctx.lineTo(px(P1,x),y):ctx.moveTo(px(P1,x),y);}ctx.stroke();
  // visited points on the curve
  ctx.fillStyle='rgba(42,120,214,0.15)';
  for(let i=0;i<n;i+=3){const x=r.xs[i];ctx.beginPath();ctx.arc(px(P1,x),fy(f(x)),3,0,2*Math.PI);ctx.fill();}
  const xc=r.xs[n-1];ctx.fillStyle='#e08a00';ctx.beginPath();ctx.arc(px(P1,xc),fy(f(xc)),6,0,2*Math.PI);ctx.fill();
  // trace
  const tx=i=>P2.x0+i/N*(P2.x1-P2.x0),ty=x=>P2.y0-(x-XL[0])/(XL[1]-XL[0])*(P2.y0-P2.y1);
  ctx.strokeStyle='#ddd';ctx.beginPath();ctx.moveTo(P2.x0,ty(0));ctx.lineTo(P2.x1,ty(0));ctx.stroke();
  ctx.strokeStyle='#2a78d6';ctx.lineWidth=1;ctx.beginPath();
  for(let i=0;i<n;i++){i?ctx.lineTo(tx(i),ty(r.xs[i])):ctx.moveTo(tx(i),ty(r.xs[i]));}ctx.stroke();
  ctx.fillStyle='#555';ctx.font='11px sans-serif';ctx.textAlign='left';
  ctx.fillText('deep valley',P2.x0+4,ty(-2)+4);ctx.fillText('shallow valley',P2.x0+4,ty(2)+4);
  ctx.textAlign='right';ctx.fillText('T = '+r.Ts[n-1].toPrecision(2),P2.x1-4,P2.y1+14);
  // histogram of the last 1,000 steps
  if(n===N){
    const nb=48,cnt=new Array(nb).fill(0),bw=(XL[1]-XL[0])/nb;
    for(let i=N-1000;i<N;i++){const b=Math.floor((r.xs[i]-XL[0])/bw);if(b>=0&&b<nb)cnt[b]++;}
    let dens=null,mx=Math.max(...cnt);
    if(r.c===1){dens=[];let z=0;for(let b=0;b<nb;b++){const x=XL[0]+(b+0.5)*bw;dens.push(Math.exp(-(f(x)-fmin)/r.Tf));z+=dens[b];}
      dens=dens.map(d=>d/z*1000);mx=Math.max(mx,...dens);}
    const hy=v=>P3.y0-v/mx*(P3.y0-P3.y1-6);
    ctx.fillStyle='rgba(42,120,214,0.55)';
    for(let b=0;b<nb;b++){const x0=px(P3,XL[0]+b*bw);ctx.fillRect(x0+1,hy(cnt[b]),px(P3,XL[0]+bw)-px(P3,XL[0])-2,P3.y0-hy(cnt[b]));}
    if(dens){ctx.strokeStyle='#e08a00';ctx.lineWidth=2.5;ctx.beginPath();
      dens.forEach((d,b)=>{const x=px(P3,XL[0]+(b+0.5)*bw);b?ctx.lineTo(x,hy(d)):ctx.moveTo(x,hy(d));});ctx.stroke();}
    let deep=0;for(let i=N-1000;i<N;i++)if(r.xs[i]<0)deep++;
    document.getElementById('saw-deep').textContent=Math.round(deep/10)+'%';
    document.getElementById('saw-best').textContent=r.best.toFixed(2);
    document.getElementById('saw-up').textContent=r.up+' of '+r.upTried;
    document.getElementById('saw-tf').textContent=r.Tf.toPrecision(2);
  }else{['saw-deep','saw-best','saw-up','saw-tf'].forEach(id=>document.getElementById(id).textContent='...');}
}
function go(){
  if(anim)cancelAnimationFrame(anim);
  run=simulate();let n=0;
  const r0=run;
  if(document.hidden){draw(run,N);return;}
  const tick=()=>{n=Math.min(N,n+60);draw(run,n);if(n<N)anim=requestAnimationFrame(tick);};tick();
  setTimeout(()=>{if(run===r0&&n<N){cancelAnimationFrame(anim);n=N;draw(run,N);}},3000);   // finish if animation is paused
}
function label(){
  document.getElementById('saw-t0o').textContent=(10**(+document.getElementById('saw-t0').value)).toPrecision(2);
  const c=+document.getElementById('saw-cool').value;document.getElementById('saw-coolo').textContent=c===1?'1 (never)':c.toFixed(2);
}
['saw-t0','saw-cool'].forEach(id=>document.getElementById(id).addEventListener('input',label));
['saw-t0','saw-cool'].forEach(id=>document.getElementById(id).addEventListener('change',go));
document.getElementById('saw-run').addEventListener('click',go);
document.getElementById('saw-seed').addEventListener('click',()=>{seed++;go();});
label();run=simulate();draw(run,N);
})();
</script>
</div>
